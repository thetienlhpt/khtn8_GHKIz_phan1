<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Học Tập - Lịch Sử & Địa Lý 8</title>
    <style>
        /* CSS Reset & Variables */
        :root {
            --dark-blue: #0a192f; /* Nền xanh dương đậm */
            --header-blue: #172a45;
            --text-main: #e2e8f0;
            --card-bg-1: #112240; /* Nền tối đan xen cho card 1 */
            --card-bg-2: #1a365d; /* Nền tối đan xen cho card 2 */
            --text-dark: #f8fafc; /* Chữ sáng để nổi trên nền tối */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--dark-blue);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
            font-size: 16px; /* Cỡ chữ cơ sở chuẩn cho mobile */
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 15px;
            background-color: var(--header-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #fbbf24;
            text-transform: uppercase;
            line-height: 1.4;
        }

        /* Fixed Stats Bar */
        .stats-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.98);
            border-top: 2px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 5px;
            z-index: 1000;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .stat-correct { color: #4ade80; }
        .stat-wrong { color: #f87171; }
        .stat-attempt { color: #fbbf24; }

        /* Container */
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Forms & Screens */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box, .result-box {
            background-color: var(--card-bg-1);
            color: var(--text-dark);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 100%;
            margin: 20px auto;
            border: 1px solid #1e293b;
        }

        .login-box h2, .result-box h2 {
            color: #60a5fa;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        /* Buttons (Đảm bảo vùng chạm lớn cho mobile >= 48px) */
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            min-height: 52px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Quiz Layout */
        #quiz-flow {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .question-card {
            border-radius: 12px;
            padding: 20px 15px;
            color: var(--text-dark);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.4s forwards ease-out;
            border: 1px solid #1e293b;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-style-0 { background-color: var(--card-bg-1); }
        .bg-style-1 { background-color: var(--card-bg-2); }

        .question-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 18px;
            color: #f1f5f9;
            line-height: 1.5;
        }

        /* Multiple Choice Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            text-align: left;
            padding: 15px;
            background-color: #1e293b;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #f8fafc;
            min-height: 48px;
            transition: 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #475569;
            background-color: #334155;
        }

        /* True/False Options (Flexbox/Grid Mobile Optimized) */
        .tf-item {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tf-text { flex: 1; font-weight: 500; font-size: 1.1rem; line-height: 1.5; }
        .tf-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .tf-btn {
            padding: 12px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 48px;
            transition: 0.2s;
        }
        .tf-btn:active:not(:disabled) { transform: scale(0.95); }

        /* Answer States */
        .correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }
        .wrong {
            background-color: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        /* Small Explanation Text */
        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(220, 38, 38, 0.1);
            border-left: 4px solid var(--danger);
            color: #fca5a5; /* Đỏ nhạt để dễ đọc trên nền tối */
            font-size: 0.95rem; /* Nhỏ hơn text chính */
            line-height: 1.4;
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.3s;
        }

        .action-area {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .result-box p { margin-bottom: 12px; font-size: 1.2rem; }
        .res-score { font-size: 2.2rem; font-weight: bold; color: var(--success); margin: 20px 0;}
        .res-msg { font-style: italic; color: #fbbf24; font-weight: bold; font-size: 1.1rem;}

        /* Footer Watermark */
        .footer-watermark {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 1rem;
            font-style: italic;
            margin-bottom: 30px; /* Chừa chỗ cho stats bar */
        }

        /* Media Queries for larger screens (Tablet/Desktop) */
        @media (min-width: 640px) {
            body { font-size: 18px; }
            .header h1 { font-size: 1.8rem; }
            .login-box, .result-box { padding: 40px; }
            .tf-item { flex-direction: row; align-items: center; justify-content: space-between; }
            .tf-actions { grid-template-columns: auto auto; min-width: 200px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>ĐỀ CƯƠNG KIỂM TRA GIỮA HỌC KỲ I<br>LỊCH SỬ & ĐỊA LÝ 8 (2026 - 2027)</h1>
    </header>

    <div class="stats-bar" id="stats-bar" style="display: none;">
        <div class="stat-item stat-attempt">Lượt thi: <span id="ui-attempts">0</span></div>
        <div class="stat-item">Đã làm: <span id="ui-completed">0</span>/30</div>
        <div class="stat-item stat-correct">Đúng: <span id="ui-correct">0</span></div>
        <div class="stat-item stat-wrong">Sai: <span id="ui-wrong">0</span></div>
    </div>

    <div class="container">
        <!-- SCREEN: LOGIN -->
        <div id="screen-login" class="screen active">
            <div class="login-box">
                <h2>THÔNG TIN HỌC SINH</h2>
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="student-name" placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label>Lớp</label>
                    <input type="text" id="student-class" placeholder="Nhập lớp (VD: 8A1)...">
                </div>
                <button class="btn" onclick="startQuiz()">BẮT ĐẦU LÀM BÀI</button>
            </div>
        </div>

        <!-- SCREEN: QUIZ -->
        <div id="screen-quiz" class="screen">
            <div id="quiz-flow">
                <!-- Questions will be injected here sequentially -->
            </div>
        </div>

        <!-- SCREEN: RESULT -->
        <div id="screen-result" class="screen">
            <div class="result-box">
                <h2>TỔNG KẾT</h2>
                <p><strong>Họ tên:</strong> <span id="res-name"></span></p>
                <p><strong>Lớp:</strong> <span id="res-class"></span></p>
                <p><strong>Số lượt làm bài:</strong> <span id="res-attempts"></span></p>
                <div class="res-score"><span id="res-correct">0</span> / 48 ý</div>
                <p class="res-msg" id="res-msg"></p>
                <button class="btn" style="margin-top: 25px;" onclick="retryQuiz()">LÀM LẠI BÀI (ĐẢO CÂU)</button>
            </div>
        </div>
    </div>

    <footer class="footer-watermark">
        Thiết kế bởi GV. Nguyễn Tiên
    </footer>

    <script>
        // --- DATA WITH EXPLANATIONS ---
        const dataPart1 = [
            {
                q: "Câu 1: Đâu là nguyên nhân chính bùng nổ các cuộc cách mạng tư sản?",
                options: [
                    "A. Nông dân không có ruộng đất nổi dậy",
                    "B. Chế độ phong kiến cản trở sự phát triển của kinh tế tư bản chủ nghĩa",
                    "C. Các nước láng giềng xâm lược",
                    "D. Giai cấp công nhân đòi hỏi quyền làm chủ"
                ],
                correct: 1,
                explanation: "Chế độ phong kiến bảo thủ đã kìm hãm mầm mống kinh tế tư bản chủ nghĩa đang phát triển mạnh mẽ, đây là nguyên nhân sâu xa và chính yếu nhất dẫn đến cách mạng."
            },
            {
                q: "Câu 2: Thành tựu nào sau đây thuộc về cách mạng công nghiệp?",
                options: [
                    "A. Phát minh ra máy tính cá nhân",
                    "B. Phát minh động cơ hơi nước cải tiến",
                    "C. Phát minh ra điện thoại di động",
                    "D. Sử dụng năng lượng nguyên tử trong sản xuất"
                ],
                correct: 1,
                explanation: "Động cơ hơi nước (do J. Watt cải tiến) là thành tựu vĩ đại nhất của Cách mạng công nghiệp, cung cấp động lực cho máy móc hoạt động không phụ thuộc vào tự nhiên."
            },
            {
                q: "Câu 3: Điểm chung trong quá trình xâm nhập của thực dân phương Tây vào Đông Nam Á là gì?",
                options: [
                    "A. Đến trước hết với tư cách là những nhà truyền giáo, sau đó mới mở rộng xâm chiếm chính trị",
                    "B. Ngay lập tức đưa quân xâm chiếm toàn bộ đất nước",
                    "C. Giúp các nước xây dựng nhà máy, đường sá trước khi cai trị",
                    "D. Đến trao đổi văn hóa và tự nguyện rời đi"
                ],
                correct: 0,
                explanation: "Thực dân phương Tây thường dùng chiêu bài truyền giáo hoặc buôn bán để dò la tình hình, làm tiền đề cho các cuộc xâm lược vũ trang sau đó."
            },
            {
                q: "Câu 4: Phong trào đấu tranh chống thực dân ở Đông Nam Á giai đoạn cuối thế kỷ XIX có đặc điểm nào?",
                options: [
                    "A. Đã có đảng phái lãnh đạo thống nhất trên toàn quốc",
                    "B. Chủ yếu do quý tộc, sĩ phu lãnh đạo, hình thức vũ trang tự phát",
                    "C. Kết hợp đấu tranh chính trị với ngoại giao thành công",
                    "D. Giành được độc lập cho hầu hết các nước"
                ],
                correct: 1,
                explanation: "Giai đoạn này phong trào chủ yếu mang tính tự phát, do giới trí thức phong kiến (sĩ phu, quý tộc) lãnh đạo, chưa có đường lối tiên tiến nên đa số thất bại."
            },
            {
                q: "Câu 5: Quá trình mở cõi của Đại Việt từ thế kỷ XVI đến XVIII diễn ra chủ yếu theo hướng nào?",
                options: ["A. Về phía Bắc", "B. Về phía Tây", "C. Về phía Nam", "D. Về phía Đông ra biển"],
                correct: 2,
                explanation: "Lịch sử gọi đây là quá trình 'Nam tiến', mở rộng lãnh thổ xuống phía Nam của các chúa Nguyễn để khai phá vùng đất mới."
            },
            {
                q: "Câu 6: Nguyên nhân chính dẫn đến xung đột Trịnh – Nguyễn là gì?",
                options: [
                    "A. Trịnh và Nguyễn tranh giành quyền kiểm soát triều đình và vùng đất",
                    "B. Do ngoại xâm chia rẽ hai phe",
                    "C. Nhân dân hai vùng có mâu thuẫn từ lâu",
                    "D. Vua Lê giao cho hai bên cai trị riêng"
                ],
                correct: 0,
                explanation: "Sau khi nhà Mạc bị đánh bại, mâu thuẫn quyền lực giữa hai dòng họ Trịnh (nắm quyền ở Đàng Ngoài) và Nguyễn (cai quản Đàng Trong) trở nên gay gắt."
            },
            {
                q: "Câu 7: Đặc điểm vị trí địa lý Việt Nam là:",
                options: [
                    "A. Nằm hoàn toàn trong nội địa châu Á",

                correct: 3,

            },

                q: "Câu 8: Phạm vi lãnh thổ nước ta bao gồm:",

                    "A. Chỉ phần đất liền",
                    "B. Chỉ các đảo có người sinh sống",

        // --- AUDIO FUNCTIONS ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(isCorrect) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (isCorrect) {
                // High pitch beep
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.2);
            } else {
                // Low pitch buzz
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- UTILS ---
        function shuffleArray(arr) {
            let copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateStatsUI() {
            document.getElementById('ui-attempts').innerText = attempts;
            document.getElementById('ui-completed').innerText = completedCount;
            document.getElementById('ui-correct').innerText = correctCount;
            document.getElementById('ui-wrong').innerText = wrongCount;
        }

        // --- LOGIC ---
        function startQuiz() {
            const name = document.getElementById('student-name').value.trim();
            if (!name) {
                const input = document.getElementById('student-name');
                input.style.borderColor = 'red';
                setTimeout(() => input.style.borderColor = '#cbd5e1', 1000);
                return;
            }

            studentName = name;
            studentClass = document.getElementById('student-class').value.trim() || "Không rõ";
            
            initAudio();
            attempts++;
            localStorage.setItem('lsdl8_attempts', attempts);

            prepareQuestions();
            
            // Reset UI State
            document.getElementById('quiz-flow').innerHTML = '';
            correctCount = 0;
            wrongCount = 0;
            completedCount = 0;
            currentRenderIndex = 0;
            
            updateStatsUI();
            document.getElementById('stats-bar').style.display = 'flex';
            showScreen('screen-quiz');
            
            renderNextQuestion();
        }

        function prepareQuestions() {
            // Deep copy to avoid mutating original states across retries
            let p1 = dataPart1.map(q => ({...q, type: 'mcq'}));
            let p2 = dataPart2.map(q => ({
                q: q.q,
                type: 'tf',
                statements: q.statements.map(s => ({...s}))
            }));

            // Shuffle internally if attempts > 1
            if (attempts > 1) {
                p1 = shuffleArray(p1);
                p2 = shuffleArray(p2);
            }

            currentQuestions = [...p1, ...p2];
        }

        function renderNextQuestion() {
            if (currentRenderIndex >= currentQuestions.length) {
                finishQuiz();
                return;
            }

            const qData = currentQuestions[currentRenderIndex];
            const qId = currentRenderIndex;
            const bgClass = qId % 2 === 0 ? 'bg-style-0' : 'bg-style-1';
            
            const card = document.createElement('div');
            card.className = `question-card ${bgClass}`;
            card.id = `card-${qId}`;

            let html = `<div class="question-title">${qData.q}</div>`;

            if (qData.type === 'mcq') {
                html += `<div class="options-list">`;
                qData.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" id="btn-mcq-${qId}-${idx}" onclick="handleMCQ(${qId}, ${idx})">${opt}</button>`;
                });
                html += `</div>`;
                html += `<div class="explanation" id="exp-${qId}">${qData.explanation}</div>`;
            } else if (qData.type === 'tf') {
                qData.statements.forEach((stmt, idx) => {
                    html += `
                        <div class="tf-item">
                            <div class="tf-text">${stmt.text}</div>
                            <div class="tf-actions">
                                <button class="tf-btn" id="btn-tf-${qId}-${idx}-true" onclick="handleTF(${qId}, ${idx}, true)">ĐÚNG</button>
                                <button class="tf-btn" id="btn-tf-${qId}-${idx}-false" onclick="handleTF(${qId}, ${idx}, false)">SAI</button>
                            </div>
                        </div>
                        <div class="explanation" id="exp-tf-${qId}-${idx}">${stmt.exp}</div>
                    `;
                });
                qData.answeredCount = 0;
            }

            html += `
                <div class="action-area">
                    <button class="btn btn-next" id="next-${qId}" onclick="goToNext(${qId})" disabled>CÂU TIẾP THEO</button>
                </div>
            `;

            card.innerHTML = html;
            document.getElementById('quiz-flow').appendChild(card);
            
            // Auto scroll to the new question
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // --- EVENT HANDLERS ---
        window.handleMCQ = function(qId, selectedIdx) {
            const qData = currentQuestions[qId];
            if (qData.answered) return;
            qData.answered = true;

            const isCorrect = (selectedIdx === qData.correct);
            playSound(isCorrect);

            if (isCorrect) correctCount++; else wrongCount++;
            
            // UI Updates
            qData.options.forEach((_, idx) => {
                const btn = document.getElementById(`btn-mcq-${qId}-${idx}`);
                btn.disabled = true;
                if (idx === qData.correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (!isCorrect) {
                document.getElementById(`exp-${qId}`).style.display = 'block';
            }

            document.getElementById(`next-${qId}`).disabled = false;
            updateStatsUI();
        }

        window.handleTF = function(qId, stmtIdx, userChoice) {
            const qData = currentQuestions[qId];
            const stmt = qData.statements[stmtIdx];
            if (stmt.answered) return;
            stmt.answered = true;
            qData.answeredCount++;

            const isCorrect = (userChoice === stmt.isCorrect);
            playSound(isCorrect);

            if (isCorrect) correctCount++; else wrongCount++;

            const btnTrue = document.getElementById(`btn-tf-${qId}-${stmtIdx}-true`);
            const btnFalse = document.getElementById(`btn-tf-${qId}-${stmtIdx}-false`);
            
            btnTrue.disabled = true;
            btnFalse.disabled = true;

            const selectedBtn = userChoice ? btnTrue : btnFalse;
            
            if (isCorrect) {
                selectedBtn.classList.add('correct');
            } else {
                selectedBtn.classList.add('wrong');
                // Show Correct choice slightly
                const correctBtn = stmt.isCorrect ? btnTrue : btnFalse;
                correctBtn.style.borderColor = 'var(--success)';
                correctBtn.style.color = 'var(--success)';
                // Show Explanation
                document.getElementById(`exp-tf-${qId}-${stmtIdx}`).style.display = 'block';
            }

            if (qData.answeredCount === 4) {
                document.getElementById(`next-${qId}`).disabled = false;
            }
            updateStatsUI();
        }

        window.goToNext = function(qId) {
            // Hide the next button of the completed question to clean up UI
            document.getElementById(`next-${qId}`).style.display = 'none';
            completedCount++;
            currentRenderIndex++;
            updateStatsUI();
            renderNextQuestion();
        }

        function finishQuiz() {
            document.getElementById('stats-bar').style.display = 'none';
            showScreen('screen-result');
            
            document.getElementById('res-name').innerText = studentName;
            document.getElementById('res-class').innerText = studentClass;
            document.getElementById('res-attempts').innerText = attempts;
            document.getElementById('res-correct').innerText = correctCount;

            const ratio = correctCount / scoreTotalItems;
            let msg = "";
            if (ratio >= 0.9) msg = "Tuyệt vời! Em nắm bài rất vững. Hãy phát huy nhé!";
            else if (ratio >= 0.7) msg = "Rất tốt! Cố gắng ôn thêm các câu bị sai để đạt điểm tối đa.";
            else if (ratio >= 0.5) msg = "Khá khen cho sự nỗ lực! Em hãy đọc kỹ lại phần giải thích.";
            else msg = "Đừng nản chí! Hãy làm lại bài để củng cố kiến thức nhé.";
            
            document.getElementById('res-msg').innerText = msg;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.retryQuiz = function() {
            startQuiz(); // will increment attempt, shuffle, and reset UI
        }
    </script>
</body>
</html>
